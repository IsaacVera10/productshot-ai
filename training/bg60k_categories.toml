# Nicho de BG60k por categoría (etapa 2 de docs/10).
# Se aplica en orden: `exact` primero, después las palabras clave de `out`, `near` y `core`.
# core: pequeño, rígido y opaco por categoría; si es mate se revisa imagen por imagen (docs/00).
# near: tamaño parecido, pero blando, transparente, reflectante o de joyería; entra con tope.
# out: grande, ropa puesta, personas, alimentos preparados o frescos, seres vivos o no es un producto.

